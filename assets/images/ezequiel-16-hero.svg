<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="ezqT">
  <title id="ezqT">El manto de Dios extendido sobre la niña abandonada en el campo · The cloak of God spread over the child abandoned in the field</title>
  <defs>
    <radialGradient id="ezqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e8c97a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ezqLow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c97a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ezqCloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="55%" stop-color="#e8c97a"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="ezqBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <circle cx="120" cy="186" r="82" fill="url(#ezqLow)"/>
  <circle cx="120" cy="52" r="54" fill="url(#ezqGlow)"/>

  <g stroke="#e8c97a" stroke-linecap="round" stroke-width="2" opacity="0.5">
    <line x1="120" y1="2" x2="120" y2="11"/>
    <line x1="88" y1="12" x2="94" y2="20"/>
    <line x1="152" y1="12" x2="146" y2="20"/>
    <line x1="72" y1="40" x2="82" y2="40"/>
    <line x1="168" y1="40" x2="158" y2="40"/>
  </g>

  <!-- Cross of light -->
  <g filter="url(#ezqBlur)">
    <rect x="114" y="18" width="12" height="44" rx="5" fill="#fff3a0"/>
    <rect x="101" y="29" width="38" height="11" rx="5" fill="#fff3a0"/>
  </g>
  <rect x="116" y="20" width="8" height="40" rx="3.5" fill="#ffffff"/>
  <rect x="103" y="31" width="34" height="7" rx="3.5" fill="#ffffff"/>

  <!-- The spread cloak: two sweeping cloth wings -->
  <path d="M120 74 C96 82 66 104 50 140 C44 154 40 168 40 178 C66 172 92 156 106 132 C114 118 118 96 120 74 Z" fill="url(#ezqCloak)" stroke="#c9a84c" stroke-width="1.2" opacity="0.92"/>
  <path d="M120 74 C144 82 174 104 190 140 C196 154 200 168 200 178 C174 172 148 156 134 132 C126 118 122 96 120 74 Z" fill="url(#ezqCloak)" stroke="#c9a84c" stroke-width="1.2" opacity="0.92"/>
  <path d="M120 74 C112 96 108 116 110 134 L130 134 C132 116 128 96 120 74 Z" fill="#fff8dc" opacity="0.55"/>

  <!-- Fold lines on the cloak -->
  <g fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5">
    <path d="M104 92 C88 104 74 122 64 144"/>
    <path d="M136 92 C152 104 166 122 176 144"/>
  </g>

  <!-- The swaddled child resting under the cloak -->
  <g>
    <ellipse cx="120" cy="188" rx="34" ry="13" fill="#fff8dc" stroke="#c9a84c" stroke-width="1.3"/>
    <path d="M94 182 C106 176 134 176 146 182" fill="none" stroke="#c9a84c" stroke-width="1.1" opacity="0.8"/>
    <path d="M98 190 C110 185 130 185 142 190" fill="none" stroke="#c9a84c" stroke-width="1.1" opacity="0.8"/>
    <circle cx="120" cy="172" r="8" fill="url(#ezqCloak)" stroke="#c9a84c" stroke-width="1.1"/>
  </g>

  <!-- Ground line of the open field -->
  <path d="M30 214 Q120 200 210 214" fill="none" stroke="#c9a84c" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.55"/>
  <g stroke="#e8c97a" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M52 206 C52 200 50 197 47 194"/>
    <path d="M188 206 C188 200 190 197 193 194"/>
    <path d="M66 210 C66 205 65 202 62 200"/>
    <path d="M174 210 C174 205 175 202 178 200"/>
  </g>
</svg>
