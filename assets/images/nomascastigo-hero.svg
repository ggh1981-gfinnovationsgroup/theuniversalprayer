<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="ncT">
  <title id="ncT">La mano de Dios se inclina para levantar la mano del hijo, con un corazón de luz entre ambas / God's hand bends down to lift His child's hand, with a heart of light between them</title>
  <defs>
    <radialGradient id="ncGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#e8c97a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ncHeartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3a0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5a623" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ncHand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eadfbf"/>
    </linearGradient>
    <linearGradient id="ncSleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8c97a"/>
    </linearGradient>
    <g id="ncH" stroke="#c9a84c" stroke-width="1.3" stroke-linejoin="round" fill="url(#ncHand)">
      <path d="M28 -13 L58 -12.5 C62 -12 62 -7 58 -6.5 L28 -6 Z" transform="rotate(-7 30 -10)"/>
      <path d="M28 -5 L64 -4.5 C68 -4 68 1 64 1.5 L28 2 Z" transform="rotate(-2 30 -2)"/>
      <path d="M28 3 L62 3.5 C66 4 66 9 62 9.5 L28 10 Z" transform="rotate(3 30 6)"/>
      <path d="M28 10.5 L54 11.5 C57.5 12 57.5 16.5 54 17 L28 16.5 Z" transform="rotate(9 30 13)"/>
      <path d="M4 -12 C12 -20 22 -26 32 -28 C36 -28 37 -24 34 -22 C26 -18 20 -12 18 -6 Z"/>
      <path d="M-6 -14 C8 -16 22 -16 33 -13 C37 -4 37 8 33 16 C22 18 8 18 -6 15 Z"/>
    </g>
  </defs>

  <circle cx="120" cy="120" r="108" fill="url(#ncGlow)"/>

  <g stroke="#e8c97a" stroke-linecap="round" stroke-width="2" opacity="0.45">
    <line x1="150" y1="12" x2="146" y2="26"/>
    <line x1="112" y1="16" x2="116" y2="30"/>
    <line x1="80" y1="34" x2="90" y2="44"/>
    <line x1="206" y1="92" x2="194" y2="96"/>
    <line x1="214" y1="128" x2="200" y2="126"/>
  </g>

  <!-- Large hand reaching down -->
  <g transform="translate(180 60) rotate(135) scale(1.2)">
    <rect x="-48" y="-17" width="44" height="34" rx="9" fill="url(#ncSleeve)" stroke="#fff3a0" stroke-width="1"/>
    <use href="#ncH"/>
  </g>

  <!-- Small hand reaching up -->
  <g transform="translate(62 178) rotate(-45) scale(0.82)">
    <rect x="-48" y="-17" width="44" height="34" rx="9" fill="#4a6fa5" stroke="#7fa3d6" stroke-width="1"/>
    <use href="#ncH" transform="scale(1 -1)"/>
  </g>

  <!-- Heart of light between -->
  <circle cx="120" cy="120" r="30" fill="url(#ncHeartGlow)"/>
  <path d="M120 132 C108 124 102 118 102 111 C102 106 106 102 111 102 C115 102 118 105 120 108 C122 105 125 102 129 102 C134 102 138 106 138 111 C138 118 132 124 120 132 Z" fill="#fff8dc" stroke="#f5a623" stroke-width="1.5"/>
</svg>
