<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="isT">
  <title id="isT">Manos en oración perseverante y cuerda que se rompe bajo la luz / Hands in persevering prayer as the cord snaps beneath the light</title>
