<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="talT">
  <title id="talT">Monedas de oro y un brote que crece hacia la cruz de luz / Gold coins and a sprout growing toward the cross of light</title>
  <defs>
    <radialGradient id="talGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e8c97a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="talLow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c97a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="talPath" x1="0" y1="200" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="60%" stop-color="#e8c97a"/>
      <stop offset="100%" stop-color="#fff8dc"/>
    </linearGradient>
    <linearGradient id="talGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="talBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <circle cx="120" cy="182" r="80" fill="url(#talLow)"/>
  <circle cx="120" cy="56" r="54" fill="url(#talGlow)"/>

  <g stroke="#e8c97a" stroke-linecap="round" stroke-width="2" opacity="0.5">
    <line x1="120" y1="4" x2="120" y2="13"/>
    <line x1="90" y1="14" x2="96" y2="22"/>
    <line x1="150" y1="14" x2="144" y2="22"/>
    <line x1="76" y1="44" x2="86" y2="44"/>
    <line x1="164" y1="44" x2="154" y2="44"/>
  </g>

  <!-- Cross of light -->
  <g filter="url(#talBlur)">
    <rect x="114" y="22" width="12" height="46" rx="5" fill="#fff3a0"/>
    <rect x="101" y="33" width="38" height="11" rx="5" fill="#fff3a0"/>
  </g>
  <rect x="116" y="24" width="8" height="42" rx="3.5" fill="#ffffff"/>
  <rect x="103" y="35" width="34" height="7" rx="3.5" fill="#ffffff"/>

  <!-- Rising path of growth -->
  <path d="M120 178 C120 162 110 152 114 134 C118 116 128 106 124 88 C122 80 120 76 120 70" fill="none" stroke="#fff3a0" stroke-width="9" stroke-linecap="round" opacity="0.25" filter="url(#talBlur)"/>
  <path d="M120 178 C120 162 110 152 114 134 C118 116 128 106 124 88 C122 80 120 76 120 70" fill="none" stroke="url(#talPath)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sprouting leaves -->
  <path d="M114 136 C103 136 96 130 94 122 C105 121 112 127 114 136 Z" fill="url(#talGold)" stroke="#c9a84c" stroke-width="1"/>
  <path d="M125 100 C135 96 140 89 141 81 C131 82 125 89 125 100 Z" fill="url(#talGold)" stroke="#c9a84c" stroke-width="1"/>

  <!-- Ground line -->
  <path d="M34 218 Q120 202 206 218" fill="none" stroke="#c9a84c" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.55"/>

  <!-- Three talents: gold coins at the base -->
  <g>
    <circle cx="82" cy="200" r="14" fill="url(#talGold)" stroke="#c9a84c" stroke-width="1.2"/>
    <circle cx="82" cy="200" r="8.5" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.75"/>
    <circle cx="82" cy="200" r="2" fill="#fff8dc"/>
    <circle cx="158" cy="200" r="14" fill="url(#talGold)" stroke="#c9a84c" stroke-width="1.2"/>
    <circle cx="158" cy="200" r="8.5" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.75"/>
    <circle cx="158" cy="200" r="2" fill="#fff8dc"/>
    <circle cx="120" cy="192" r="17" fill="url(#talGold)" stroke="#c9a84c" stroke-width="1.3"/>
    <circle cx="120" cy="192" r="10.5" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.8"/>
    <path d="M120 186.5 V197.5 M114.5 192 H125.5" stroke="#fff8dc" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
