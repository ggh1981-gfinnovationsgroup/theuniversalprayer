<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="dpmT">
  <title id="dpmT">Cadena rota y ciclo abierto que se vuelve camino hacia la cruz de luz / Broken chain and an opened loop becoming a path toward the cross of light</title>
  <defs>
    <radialGradient id="dpmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e8c97a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dpmLow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c97a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dpmPath" x1="0" y1="200" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="60%" stop-color="#e8c97a"/>
      <stop offset="100%" stop-color="#fff8dc"/>
    </linearGradient>
    <linearGradient id="dpmGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="dpmBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <circle cx="120" cy="170" r="76" fill="url(#dpmLow)"/>
  <circle cx="120" cy="56" r="54" fill="url(#dpmGlow)"/>

  <g stroke="#e8c97a" stroke-linecap="round" stroke-width="2" opacity="0.5">
    <line x1="120" y1="4" x2="120" y2="13"/>
    <line x1="90" y1="14" x2="96" y2="22"/>
    <line x1="150" y1="14" x2="144" y2="22"/>
    <line x1="76" y1="44" x2="86" y2="44"/>
    <line x1="164" y1="44" x2="154" y2="44"/>
  </g>

  <!-- Cross of light -->
  <g filter="url(#dpmBlur)">
    <rect x="114" y="22" width="12" height="46" rx="5" fill="#fff3a0"/>
    <rect x="101" y="33" width="38" height="11" rx="5" fill="#fff3a0"/>
  </g>
  <rect x="116" y="24" width="8" height="42" rx="3.5" fill="#ffffff"/>
  <rect x="103" y="35" width="34" height="7" rx="3.5" fill="#ffffff"/>

  <!-- Old habit loop, broken open at the top -->
  <path d="M137.8 121.1 A52 52 0 1 1 102.2 121.1" fill="none" stroke="#7a7f93" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.75"/>
  <path d="M96 116 L103 121 L95 127" fill="none" stroke="#7a7f93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- New path rising toward the light -->
  <path d="M120 198 C120 180 108 168 113 148 C118 128 130 118 125 98 C122 86 120 80 120 72" fill="none" stroke="#fff3a0" stroke-width="9" stroke-linecap="round" opacity="0.25" filter="url(#dpmBlur)"/>
  <path d="M120 198 C120 180 108 168 113 148 C118 128 130 118 125 98 C122 86 120 80 120 72" fill="none" stroke="url(#dpmPath)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sprouting leaves -->
  <path d="M113 150 C102 150 95 144 93 136 C104 135 111 141 113 150 Z" fill="url(#dpmGold)" stroke="#c9a84c" stroke-width="1"/>
  <path d="M126 112 C136 108 141 101 142 93 C132 94 126 101 126 112 Z" fill="url(#dpmGold)" stroke="#c9a84c" stroke-width="1"/>

  <!-- Chain: outer links intact, middle link broken open -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="44" cy="188" rx="24" ry="11" stroke="#8a8ea0" stroke-width="5.5"/>
    <ellipse cx="196" cy="188" rx="24" ry="11" stroke="#8a8ea0" stroke-width="5.5"/>
    <path d="M98 178 C82 172 64 178 64 188 C64 197 78 202 94 198" stroke="#8a8ea0" stroke-width="5.5" transform="rotate(10 64 188)"/>
    <path d="M142 178 C158 172 176 178 176 188 C176 197 162 202 146 198" stroke="#8a8ea0" stroke-width="5.5" transform="rotate(-10 176 188)"/>
    <g stroke="#d6d8e0" stroke-width="1.3" opacity="0.55">
      <path d="M26 182 C36 176 52 176 62 182"/>
      <path d="M178 182 C188 176 204 176 214 182"/>
    </g>
  </g>
  <g stroke="#fff3a0" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="104" y1="176" x2="110" y2="172"/>
    <line x1="102" y1="198" x2="108" y2="204"/>
    <line x1="136" y1="176" x2="130" y2="172"/>
    <line x1="138" y1="198" x2="132" y2="204"/>
  </g>
</svg>
