<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Acto de Adoracion Suprema</title>
  <desc id="desc">Icono dorado con cruz, halo radiante y simbolo trinitario para uso devocional.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e8c97a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGold" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff6d9"/>
      <stop offset="62%" stop-color="#e8c97a"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </radialGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="720" fill="transparent"/>
  <circle cx="360" cy="360" r="260" fill="url(#bgGlow)"/>

  <!-- Radiant rays -->
  <g stroke="#e8c97a" stroke-linecap="round" opacity="0.62" filter="url(#softGlow)">
    <line x1="360" y1="62" x2="360" y2="124" stroke-width="8"/>
    <line x1="360" y1="596" x2="360" y2="658" stroke-width="8"/>
    <line x1="62" y1="360" x2="124" y2="360" stroke-width="8"/>
    <line x1="596" y1="360" x2="658" y2="360" stroke-width="8"/>

    <line x1="145" y1="145" x2="190" y2="190" stroke-width="6"/>
    <line x1="530" y1="530" x2="575" y2="575" stroke-width="6"/>
    <line x1="575" y1="145" x2="530" y2="190" stroke-width="6"/>
    <line x1="190" y1="530" x2="145" y2="575" stroke-width="6"/>

    <line x1="360" y1="96" x2="360" y2="130" stroke-width="3" opacity="0.5"/>
    <line x1="360" y1="590" x2="360" y2="624" stroke-width="3" opacity="0.5"/>
    <line x1="96" y1="360" x2="130" y2="360" stroke-width="3" opacity="0.5"/>
    <line x1="590" y1="360" x2="624" y2="360" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Trinity symbol (three circles) -->
  <g fill="none" stroke="#e8c97a" stroke-width="8" opacity="0.88">
    <circle cx="360" cy="286" r="72"/>
    <circle cx="294" cy="402" r="72"/>
    <circle cx="426" cy="402" r="72"/>
  </g>

  <!-- Central host and cross -->
  <g filter="url(#softGlow)">
    <circle cx="360" cy="360" r="94" fill="url(#coreGold)" opacity="0.96"/>
    <circle cx="360" cy="360" r="110" fill="none" stroke="#c9a84c" stroke-opacity="0.45" stroke-width="3"/>
    <line x1="360" y1="300" x2="360" y2="420" stroke="url(#barGold)" stroke-width="14" stroke-linecap="round"/>
    <line x1="300" y1="360" x2="420" y2="360" stroke="url(#barGold)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Crown base -->
  <g fill="none" stroke="#c9a84c" stroke-width="5" opacity="0.7">
    <path d="M250 500c28 22 62 34 110 34s82-12 110-34"/>
    <path d="M276 526c24 15 51 23 84 23s60-8 84-23" opacity="0.65"/>
  </g>
</svg>
